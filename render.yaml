services:
  - type: web
    name: apexcare-patient-experience
    runtime: node
    plan: free               # sleeps when idle; upgrade to starter to keep it always on
    region: singapore
    buildCommand: npm ci
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: TZ_NAME
        value: Asia/Riyadh
      - key: OVERDUE_DAYS
        value: "3"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
