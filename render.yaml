services:
  - type: web
    name: apexcare-patient-experience
    runtime: node
    plan: starter            # free sleeps when idle; starter recommended for daily clinic use
    region: frankfurt
    buildCommand: npm ci
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: TZ_NAME
        value: Asia/Riyadh
      - key: OVERDUE_DAYS
        value: "3"
